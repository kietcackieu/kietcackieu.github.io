<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kietsu • magnetic stardust</title>
  
  <style>
    /* Ẩn con trỏ chuột mặc định */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
    }

    body {
      background-color: #030305;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* CANVAS HẠT SÁNG HÚT VỀ CON TRỎ CHUỘT (SIÊU MƯỢT, 0% LAG) */
    #gravityCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* LỚP PHỦ MỜ TỐI HUYỀN BÍ */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(3, 3, 5, 0.88) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* CON TRỎ CHUỘT CUSTOM */
    #cursorDot {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff;
    }

    #cursorRing {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.75);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.18s, height 0.18s;
    }

    /* Hạt sáng bay ra từ chuột */
    .mouse-sparkle {
      position: fixed;
      width: 3.5px;
      height: 3.5px;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99997;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 6px #ffffff;
      animation: fadeUpSparkle 0.7s ease-out forwards;
    }

    @keyframes fadeUpSparkle {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -20px) scale(0.2);
      }
    }
  </style>
</head>
<body>

  <!-- Canvas Hạt Sáng Hút Về Hướng Chuột -->
  <canvas id="gravityCanvas"></canvas>

  <div class="vignette-overlay"></div>

  <!-- Con trỏ chuột -->
  <div id="cursorDot"></div>
  <div id="cursorRing"></div>

  <script>
    // ==========================================
    // 1. HIỆU ỨNG HẠT SÁNG BAY VỀ PHÍA CHUỘT (MAGNETIC STARDUST)
    // ==========================================
    const canvas = document.getElementById('gravityCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;

    const particleCount = 85;
    const particles = [];

    class Particle {
      constructor() {
        this.reset(true);
      }

      reset(randomY = false) {
        this.x = Math.random() * width;
        this.y = randomY ? Math.random() * height : height + Math.random() * 50;
        this.vx = (Math.random() - 0.5) * 0.8;
        this.vy = -(Math.random() * 1.5 + 0.8); // Hướng bay cơ bản từ dưới lên
        this.size = Math.random() * 2.2 + 0.8;
        this.baseAlpha = Math.random() * 0.5 + 0.3;
        this.alpha = this.baseAlpha;
        this.twinkleSpeed = Math.random() * 0.04 + 0.02;
        this.twinkleAngle = Math.random() * Math.PI * 2;
      }

      update() {
        // Tính khoảng cách và góc tới con trỏ chuột
        const dx = mouseX - this.x;
        const dy = mouseY - this.y;
        const dist = Math.hypot(dx, dy);

        // Lực hút từ trường nhẹ nhàng kéo hạt bay về hướng chuột
        if (dist > 15) {
          const force = Math.min(2.5, 90 / Math.max(dist, 60));
          this.vx += (dx / dist) * force * 0.06;
          this.vy += (dy / dist) * force * 0.06;
        }

        // Lực nổi nhẹ từ dưới lên
        this.vy -= 0.04;

        // Ma sát không khí giúp chuyển động mượt mà không bị văng loạn
        this.vx *= 0.95;
        this.vy *= 0.95;

        // Cập nhật vị trí
        this.x += this.vx;
        this.y += this.vy;

        // Hiệu ứng nhấp nháy lấp lánh
        this.twinkleAngle += this.twinkleSpeed;
        this.alpha = this.baseAlpha + Math.sin(this.twinkleAngle) * 0.18;

        // Tái tạo lại ở đáy khi hạt bay quá gần chuột hoặc vượt ra ngoài màn hình
        if (dist < 18 || this.y < -30 || this.x < -40 || this.x > width + 40) {
          this.reset(false);
        }
      }

      draw() {
        ctx.globalAlpha = Math.max(0.1, Math.min(1.0, this.alpha));
        ctx.beginPath();
        ctx.arc(this.x, this.y, this.size, 0, Math.PI * 2);
        ctx.fill();
      }
    }

    // Khởi tạo các hạt
    for (let i = 0; i < particleCount; i++) {
      particles.push(new Particle());
    }

    function animate() {
      // Xóa nền đen mờ nhẹ tạo vệt chuyển động huyền ảo
      ctx.fillStyle = '#030305';
      ctx.fillRect(0, 0, width, height);

      ctx.fillStyle = '#ffffff';

      particles.forEach(p => {
        p.update();
        p.draw();
      });

      ctx.globalAlpha = 1.0;
      requestAnimationFrame(animate);
    }
    animate();

    // ==========================================
    // 2. CON TRỎ CHUỘT CUSTOM & VỆT SÁNG
    // ==========================================
    const cursorDot = document.getElementById('cursorDot');
    const cursorRing = document.getElementById('cursorRing');
    let ringX = mouseX;
    let ringY = mouseY;

    window.addEventListener('mousemove', (e) => {
      mouseX = e.clientX;
      mouseY = e.clientY;

      cursorDot.style.left = mouseX + 'px';
      cursorDot.style.top = mouseY + 'px';

      if (Math.random() < 0.28) {
        createMouseSparkle(mouseX, mouseY);
      }
    });

    function renderCursor() {
      ringX += (mouseX - ringX) * 0.2;
      ringY += (mouseY - ringY) * 0.2;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    function createMouseSparkle(x, y) {
      const sp = document.createElement('div');
      sp.className = 'mouse-sparkle';
      sp.style.left = (x + (Math.random() - 0.5) * 6) + 'px';
      sp.style.top = y + 'px';
      document.body.appendChild(sp);

      setTimeout(() => {
        if (sp.parentNode) sp.parentNode.removeChild(sp);
      }, 700);
    }
  </script>
</body>
</html>
