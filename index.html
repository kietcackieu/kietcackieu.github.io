<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Kietcackieu | Developer Profile</title>
  <style>
    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
    }
    body {
      background-color: #0d1117;
      color: #c9d1d9;
      display: flex;
      justify-content: center;
      align-items: center;
      min-height: 100vh;
      padding: 20px;
    }
    .card {
      background-color: #161b22;
      border: 1px solid #30363d;
      border-radius: 16px;
      padding: 32px;
      max-width: 420px;
      width: 100%;
      text-align: center;
      box-shadow: 0 8px 24px rgba(0, 0, 0, 0.4);
    }
    h1 {
      color: #58a6ff;
      font-size: 24px;
      margin-bottom: 8px;
    }
    .subtitle {
      color: #8b949e;
      font-size: 14px;
      margin-bottom: 20px;
    }
    .tags {
      display: flex;
      justify-content: center;
      gap: 8px;
      flex-wrap: wrap;
      margin-bottom: 24px;
    }
    .tag {
      background: #21262d;
      color: #58a6ff;
      border: 1px solid #30363d;
      padding: 4px 10px;
      border-radius: 20px;
      font-size: 12px;
    }
    .btn {
      display: inline-block;
      width: 100%;
      padding: 12px;
      background-color: #238636;
      color: #ffffff;
      text-decoration: none;
      font-weight: 600;
      border-radius: 8px;
      transition: background-color 0.2s;
    }
    .btn:hover {
      background-color: #2ea043;
    }
  </style>
</head>
<body>
  <div class="card">

    </div>
    <a class="btn" href="https://discord.gg/8eBC2K4M3M" target="_blank">Tham gia Discord Server</a>

</body>
</html>
