<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>kietsu • luminous flow</title>
  
  <style>
    /* Ẩn con trỏ mặc định */
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
      cursor: none !important;
    }

    body {
      background-color: #000000;
      min-height: 100vh;
      overflow: hidden;
      position: relative;
    }

    /* CANVAS HIỆU ỨNG LUMINOUS FLOW (ĐEN & TRẮNG) */
    #luminousCanvas {
      position: fixed;
      inset: 0;
      width: 100%;
      height: 100%;
      z-index: 0;
    }

    /* LỚP PHỦ TỐI MỜ VIỀN VIGNETTE */
    .vignette-overlay {
      position: fixed;
      inset: 0;
      background: radial-gradient(circle at center, transparent 40%, rgba(0, 0, 0, 0.85) 100%);
      z-index: 1;
      pointer-events: none;
    }

    /* CON TRỎ CHUỘT CUSTOM TRẮNG TINH KHÔI */
    #cursorDot {
      position: fixed;
      top: 0;
      left: 0;
      width: 6px;
      height: 6px;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99999;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 10px #ffffff, 0 0 20px rgba(255, 255, 255, 0.9);
    }

    #cursorRing {
      position: fixed;
      top: 0;
      left: 0;
      width: 32px;
      height: 32px;
      border: 1.5px solid rgba(255, 255, 255, 0.7);
      border-radius: 50%;
      pointer-events: none;
      z-index: 99998;
      transform: translate(-50%, -50%);
      transition: width 0.2s, height 0.2s;
    }

    /* Hạt bụi sáng lấp lánh màu trắng */
    .white-sparkle {
      position: fixed;
      width: 3.5px;
      height: 3.5px;
      background: #ffffff;
      border-radius: 50%;
      pointer-events: none;
      z-index: 99997;
      transform: translate(-50%, -50%);
      box-shadow: 0 0 8px #ffffff;
      animation: fadeSparkle 0.8s ease-out forwards;
    }

    @keyframes fadeSparkle {
      0% {
        opacity: 1;
        transform: translate(-50%, -50%) scale(1);
      }
      100% {
        opacity: 0;
        transform: translate(-50%, -20px) scale(0.2);
      }
    }
  </style>
</head>
<body>

  <!-- Canvas Luminous Flow Effect -->
  <canvas id="luminousCanvas"></canvas>

  <!-- Lớp phủ bóng tối viền màn hình -->
  <div class="vignette-overlay"></div>

  <!-- Con trỏ chuột trắng tinh khôi -->
  <div id="cursorDot"></div>
  <div id="cursorRing"></div>

  <script>
    // ==========================================
    // 1. HIỆU ỨNG LUMINOUS FLOW EFFECT (ĐEN & TRẮNG)
    // ==========================================
    const canvas = document.getElementById('luminousCanvas');
    const ctx = canvas.getContext('2d');

    let width, height;
    function resize() {
      width = canvas.width = window.innerWidth;
      height = canvas.height = window.innerHeight;
    }
    resize();
    window.addEventListener('resize', resize);

    let mouseX = window.innerWidth / 2;
    let mouseY = window.innerHeight / 2;
    let targetMouseX = mouseX;
    let targetMouseY = mouseY;

    // Cấu hình các dải luồng sáng trắng (Luminous Beams)
    const streams = [
      { yBase: 0.22, speed: 0.007, amp1: 60, amp2: 45, freq: 0.0018, width: 3.5, glow: 35, alpha: 0.85 },
      { yBase: 0.38, speed: 0.005, amp1: 85, amp2: 50, freq: 0.0014, width: 5.0, glow: 50, alpha: 0.95 },
      { yBase: 0.52, speed: 0.008, amp1: 70, amp2: 60, freq: 0.0020, width: 4.0, glow: 40, alpha: 0.80 },
      { yBase: 0.68, speed: 0.006, amp1: 95, amp2: 55, freq: 0.0016, width: 6.0, glow: 60, alpha: 0.90 },
      { yBase: 0.82, speed: 0.009, amp1: 65, amp2: 40, freq: 0.0022, width: 3.0, glow: 30, alpha: 0.75 }
    ];

    let time = 0;

    function renderLuminousFlow() {
      time++;

      // Chuột di chuyển mượt mà
      mouseX += (targetMouseX - mouseX) * 0.05;
      mouseY += (targetMouseY - mouseY) * 0.05;

      // Xóa nền đen tuyệt đối
      ctx.fillStyle = '#000000';
      ctx.fillRect(0, 0, width, height);

      // Chế độ hòa trộn ánh sáng phát quang (Additive blend)
      ctx.globalCompositeOperation = 'screen';

      streams.forEach((st, idx) => {
        const centerY = st.yBase * height;
        const phaseShift = idx * 1.5;

        // Vẽ lớp hào quang tỏa sáng rộng (Soft Glow)
        ctx.save();
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = st.glow;
        ctx.lineWidth = st.width * 2.2;
        ctx.strokeStyle = `rgba(255, 255, 255, ${st.alpha * 0.25})`;
        drawStreamPath(st, centerY, phaseShift);
        ctx.stroke();
        ctx.restore();

        // Vẽ lõi luồng sáng trắng sắc nét (Sharp Core)
        ctx.save();
        ctx.shadowColor = '#ffffff';
        ctx.shadowBlur = st.glow * 0.5;
        ctx.lineWidth = st.width;
        ctx.strokeStyle = `rgba(255, 255, 255, ${st.alpha})`;
        drawStreamPath(st, centerY, phaseShift);
        ctx.stroke();
        ctx.restore();
      });

      // Trả lại chế độ vẽ bình thường
      ctx.globalCompositeOperation = 'source-over';

      requestAnimationFrame(renderLuminousFlow);
    }

    // Hàm tính toán và vẽ đường cong lượn sóng uốn lượn mượt mà
    function drawStreamPath(st, centerY, phaseShift) {
      ctx.beginPath();

      const mouseFactorX = (mouseX / width - 0.5);
      const mouseFactorY = (mouseY / height - 0.5);

      for (let x = -50; x <= width + 50; x += 20) {
        // Tổ hợp sóng sine và cosine tạo chuyển động đung đưa uyển chuyển tự nhiên
        const wave1 = Math.sin(x * st.freq + time * st.speed + phaseShift) * st.amp1;
        const wave2 = Math.cos(x * st.freq * 0.7 - time * st.speed * 0.6 + phaseShift) * st.amp2;

        // Tác động uốn cong theo con trỏ chuột
        const distFromCenter = Math.sin((x / width) * Math.PI);
        const mouseBend = distFromCenter * mouseFactorY * 70;

        const y = centerY + wave1 + wave2 + mouseBend;

        if (x === -50) {
          ctx.moveTo(x, y);
        } else {
          ctx.lineTo(x, y);
        }
      }
    }

    renderLuminousFlow();

    // ==========================================
    // 2. CON TRỎ CHUỘT CUSTOM & VỆT SÁNG TRẮNG
    // ==========================================
    const cursorDot = document.getElementById('cursorDot');
    const cursorRing = document.getElementById('cursorRing');
    let ringX = mouseX;
    let ringY = mouseY;

    window.addEventListener('mousemove', (e) => {
      targetMouseX = e.clientX;
      targetMouseY = e.clientY;

      cursorDot.style.left = e.clientX + 'px';
      cursorDot.style.top = e.clientY + 'px';

      if (Math.random() < 0.28) {
        createWhiteSparkle(e.clientX, e.clientY);
      }
    });

    function renderCursor() {
      ringX += (targetMouseX - ringX) * 0.18;
      ringY += (targetMouseY - ringY) * 0.18;
      cursorRing.style.left = ringX + 'px';
      cursorRing.style.top = ringY + 'px';
      requestAnimationFrame(renderCursor);
    }
    renderCursor();

    function createWhiteSparkle(x, y) {
      const sp = document.createElement('div');
      sp.className = 'white-sparkle';
      sp.style.left = (x + (Math.random() - 0.5) * 8) + 'px';
      sp.style.top = y + 'px';
      document.body.appendChild(sp);

      setTimeout(() => {
        if (sp.parentNode) sp.parentNode.removeChild(sp);
      }, 780);
    }
  </script>
</body>
</html>
