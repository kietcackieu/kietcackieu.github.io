<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Biolink Studio • Trình Tạo Profile Cá Nhân</title>
  
  <!-- Google Fonts & Font Awesome -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:wght@400;500;600;700;800&family=JetBrains+Mono:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background-color: #090a0f;
      color: #f1f5f9;
      min-height: 100vh;
      display: flex;
      flex-direction: column;
    }

    /* Header */
    header {
      background: rgba(15, 18, 25, 0.9);
      backdrop-filter: blur(12px);
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding: 14px 24px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      position: sticky;
      top: 0;
      z-index: 50;
    }

    .brand {
      display: flex;
      align-items: center;
      gap: 10px;
      font-weight: 800;
      font-size: 16px;
    }

    .brand i {
      color: #6366f1;
      font-size: 20px;
    }

    .btn-export {
      background: linear-gradient(135deg, #6366f1, #06b6d4);
      color: #ffffff;
      border: none;
      padding: 10px 20px;
      border-radius: 12px;
      font-weight: 700;
      font-size: 13px;
      cursor: pointer;
      display: flex;
      align-items: center;
      gap: 8px;
      box-shadow: 0 4px 14px rgba(99, 102, 241, 0.4);
      transition: all 0.2s;
    }

    .btn-export:hover {
      opacity: 0.9;
      transform: translateY(-1px);
    }

    /* Main Container (Chia 2 cột: Cột trái là Form chỉnh, Cột phải là Xem trước Live Preview) */
    .studio-container {
      flex: 1;
      display: grid;
      grid-template-columns: 420px 1fr;
      height: calc(100vh - 65px);
      overflow: hidden;
    }

    @media (max-width: 900px) {
      .studio-container {
        grid-template-columns: 1fr;
        height: auto;
        overflow: visible;
      }
    }

    /* Cột trái: Form điều khiển */
    .controls-sidebar {
      background: #0f121a;
      border-right: 1px solid rgba(255, 255, 255, 0.1);
      padding: 24px;
      overflow-y: auto;
      display: flex;
      flex-direction: column;
      gap: 24px;
    }

    .section-title {
      font-size: 12px;
      font-family: 'JetBrains Mono', monospace;
      color: #818cf8;
      text-transform: uppercase;
      letter-spacing: 1px;
      font-weight: 700;
      display: flex;
      align-items: center;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group {
      display: flex;
      flex-direction: column;
      gap: 6px;
      margin-bottom: 12px;
    }

    .form-group label {
      font-size: 12px;
      color: #94a3b8;
      font-weight: 600;
    }

    .form-input {
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 10px;
      padding: 10px 14px;
      color: #ffffff;
      font-size: 13px;
      outline: none;
      transition: border-color 0.2s;
    }

    .form-input:focus {
      border-color: #6366f1;
    }

    .file-btn {
      padding: 12px;
      border: 1.5px dashed rgba(255, 255, 255, 0.25);
      border-radius: 12px;
      text-align: center;
      font-size: 12px;
      color: #cbd5e1;
      background: rgba(255, 255, 255, 0.02);
      cursor: pointer;
      transition: all 0.2s;
      display: block;
    }

    .file-btn:hover {
      border-color: #6366f1;
      background: rgba(99, 102, 241, 0.1);
      color: #ffffff;
    }

    /* Cột phải: Khung Live Preview */
    .preview-area {
      background: #06070a;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      position: relative;
      overflow: hidden;
    }

    .preview-notice {
      position: absolute;
      top: 14px;
      background: rgba(15, 23, 42, 0.8);
      border: 1px solid rgba(255, 255, 255, 0.1);
      padding: 6px 14px;
      border-radius: 20px;
      font-size: 11px;
      font-family: 'JetBrains Mono', monospace;
      color: #94a3b8;
      display: flex;
      align-items: center;
      gap: 6px;
    }

    /* Màn hình giả lập điện thoại/máy tính */
    .device-mockup {
      width: 380px;
      height: 680px;
      max-height: 90vh;
      border-radius: 36px;
      border: 8px solid #1e2433;
      box-shadow: 0 25px 60px rgba(0, 0, 0, 0.8), 0 0 0 1px rgba(255, 255, 255, 0.1);
      position: relative;
      overflow: hidden;
      background: #000000;
    }

    /* Nội dung bên trong giả lập */
    .mock-bg {
      position: absolute;
      inset: 0;
      width: 100%;
      height: 100%;
      object-fit: cover;
      z-index: 1;
    }

    .mock-overlay {
      position: absolute;
      inset: 0;
      background: rgba(0, 0, 0, 0.45);
      z-index: 2;
    }

    .mock-content {
      position: relative;
      z-index: 10;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      padding: 24px;
      text-align: center;
    }

    .mock-card {
      background: rgba(15, 18, 25, 0.7);
      backdrop-filter: blur(12px);
      -webkit-backdrop-filter: blur(12px);
      border: 1px solid rgba(255, 255, 255, 0.15);
      border-radius: 24px;
      padding: 24px 20px;
      width: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 14px;
      box-shadow: 0 20px 40px rgba(0, 0, 0, 0.7);
    }
  </style>
</head>
<body>

  <!-- HEADER THANH ĐIỀU HƯỚNG CỦA RIÊNG BẠN -->
  <header>
    <div class="brand">
      <i class="fa-solid fa-wand-magic-sparkles"></i>
      <span>Biolink Studio • Tab Quản Trị Bí Mật Của Bạn</span>
    </div>

    <!-- Nút xuất file để đưa lên GitHub -->
    <button id="btnExport" class="btn-export">
      <i class="fa-solid fa-download"></i>
      <span>Xuất file index.html để đẩy lên GitHub</span>
    </button>
  </header>

  <!-- KHUNG CHÍNH: FORM CHỈNH TRÁI - PREVIEW PHẢI -->
  <div class="studio-container">
    
    <!-- CỘT TRÁI: TẤT CẢ NÚT ĐIỀU KHIỂN & CHỌN FILE -->
    <aside class="controls-sidebar">
      
      <!-- PHẦN 1: NỀN VIDEO / ẢNH -->
      <div>
        <div class="section-title"><i class="fa-solid fa-image"></i> 1. Nền trang web</div>
        <div class="form-group">
          <label>Tải video hoặc ảnh từ máy tính bạn:</label>
          <label class="file-btn">
            <i class="fa-solid fa-upload" style="margin-right: 6px;"></i>
            <span>Bấm vào đây để chọn file (.mp4, .gif, .jpg)</span>
            <input type="file" id="mediaFileInput" accept="video/*,image/*" style="display: none;">
          </label>
        </div>
        <div class="form-group">
          <label>Hoặc dán đường link online:</label>
          <input type="text" id="mediaUrlInput" class="form-input" placeholder="https://...mp4 hoặc .gif">
        </div>
      </div>

      <!-- PHẦN 2: THÔNG TIN PROFILE -->
      <div>
        <div class="section-title"><i class="fa-solid fa-user"></i> 2. Thông tin hiển thị</div>
        <div class="form-group">
          <label>Tên hiển thị (Username):</label>
          <input type="text" id="nameInput" class="form-input" value="kietsu">
        </div>
        <div class="form-group">
          <label>Dòng trạng thái / Bio quote:</label>
          <input type="text" id="statusInput" class="form-input" value="đến là đón đụng là chạm 💀🔥">
        </div>
        <div class="form-group">
          <label>Vị trí địa lý:</label>
          <input type="text" id="locationInput" class="form-input" value="TP HẢI PHÒNG">
        </div>
      </div>

      <!-- PHẦN 3: MÀN HÌNH KHÓA -->
      <div>
        <div class="section-title"><i class="fa-solid fa-lock"></i> 3. Màn hình khóa (Click to enter)</div>
        <div class="form-group">
          <label>Tiêu đề chính:</label>
          <input type="text" id="lockTitleInput" class="form-input" value="đấm vào đây 👊">
        </div>
        <div class="form-group">
          <label>Dòng chữ nhỏ bên dưới:</label>
          <input type="text" id="lockSubInput" class="form-input" value="anh muốn ôm em lần cuối 🥀">
        </div>
      </div>

      <!-- PHẦN 4: LIÊN KẾT MẠNG XÃ HỘI -->
      <div>
        <div class="section-title"><i class="fa-solid fa-share-nodes"></i> 4. Mạng xã hội</div>
        <div class="form-group">
          <label>Link Roblox:</label>
          <input type="text" id="robloxInput" class="form-input" value="https://roblox.com">
        </div>
        <div class="form-group">
          <label>Link Facebook:</label>
          <input type="text" id="facebookInput" class="form-input" value="https://facebook.com">
        </div>
        <div class="form-group">
          <label>Link TikTok:</label>
          <input type="text" id="tiktokInput" class="form-input" value="https://tiktok.com">
        </div>
      </div>

    </aside>

    <!-- CỘT PHẢI: XEM TRƯỚC TRỰC TIẾP THAY ĐỔI THEO THỜI GIAN THỰC -->
    <main class="preview-area">
      <div class="preview-notice">
        <i class="fa-solid fa-eye text-indigo-400"></i>
        <span>Bản xem trước trực tiếp (Live Preview)</span>
      </div>

      <div class="device-mockup">
        <!-- Nền video / ảnh giả lập -->
        <video id="mockVideo" class="mock-bg" autoplay loop muted playsinline style="display: none;"></video>
        <img id="mockImg" class="mock-bg" src="https://i.pinimg.com/originals/25/2b/4d/252b4d47e08f18c4efaafed82e11d20.jpg" alt="Background">
        <div class="mock-overlay"></div>

        <!-- Nội dung card -->
        <div class="mock-content">
          <div class="mock-card">
            
            <!-- Avatar tròn -->
            <div style="width: 80px; height: 80px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 0 20px rgba(255,255,255,0.2);">
              <img src="https://i.pinimg.com/564x/25/2b/4d/252b4d47e08f18c4efaafed82e11d20.jpg" alt="Avatar" style="width: 100%; height: 100%; object-fit: cover;">
            </div>

            <!-- Tên & Bio -->
            <div>
              <div style="display: flex; align-items: center; justify-content: center; gap: 6px;">
                <h3 id="prevName" style="font-size: 22px; font-weight: 800;">kietsu</h3>
                <i class="fa-solid fa-circle-check" style="color: #06b6d4; font-size: 14px;"></i>
              </div>
              <p id="prevStatus" style="font-size: 12px; color: #cbd5e1; margin-top: 4px;">đến là đón đụng là chạm 💀🔥</p>
            </div>

            <!-- Icons -->
            <div style="display: flex; gap: 8px;">
              <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px;"><i class="fa-solid fa-cube"></i></span>
              <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px;"><i class="fa-brands fa-facebook-f"></i></span>
              <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px;"><i class="fa-brands fa-tiktok"></i></span>
              <span style="width: 32px; height: 32px; border-radius: 8px; background: rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: center; font-size: 12px;"><i class="fa-brands fa-spotify"></i></span>
            </div>

            <!-- Music Bar -->
            <div style="width: 100%; background: rgba(0,0,0,0.5); border-radius: 10px; padding: 10px 14px; border: 1px solid rgba(255,255,255,0.1); display: flex; align-items: center; justify-content: space-between;">
              <div style="display: flex; align-items: center; gap: 8px; text-align: left;">
                <i class="fa-solid fa-music" style="color: #818cf8; font-size: 11px;"></i>
                <div>
                  <p style="font-size: 11px; font-weight: 700;">Người Dưng</p>
                  <p style="font-size: 9px; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">Lofi Chill</p>
                </div>
              </div>
              <i class="fa-solid fa-play" style="font-size: 10px; color: #cbd5e1;"></i>
            </div>

            <!-- Stats -->
            <div style="font-size: 10px; font-family: 'JetBrains Mono', monospace; color: #94a3b8; display: flex; gap: 10px;">
              <span style="color: #f43f5e;"><i class="fa-solid fa-heart"></i> 3</span>
              <span><i class="fa-solid fa-eye"></i> 140</span>
              <span style="color: #10b981;"><i class="fa-solid fa-location-dot"></i> <span id="prevLoc">TP HẢI PHÒNG</span></span>
            </div>

          </div>
        </div>

      </div>
    </main>

  </div>

  <!-- SCRIPT LOGIC -->
  <script>
    let appConfig = {
      mediaType: 'image',
      mediaUrl: 'https://i.pinimg.com/originals/25/2b/4d/252b4d47e08f18c4efaafed82e11d20.jpg',
      name: 'kietsu',
      status: 'đến là đón đụng là chạm 💀🔥',
      location: 'TP HẢI PHÒNG',
      lockTitle: 'đấm vào đây 👊',
      lockSub: 'anh muốn ôm em lần cuối 🥀',
      roblox: 'https://roblox.com',
      facebook: 'https://facebook.com',
      tiktok: 'https://tiktok.com'
    };

    // DOM Elements
    const mediaFileInput = document.getElementById('mediaFileInput');
    const mediaUrlInput = document.getElementById('mediaUrlInput');
    const nameInput = document.getElementById('nameInput');
    const statusInput = document.getElementById('statusInput');
    const locationInput = document.getElementById('locationInput');
    const lockTitleInput = document.getElementById('lockTitleInput');
    const lockSubInput = document.getElementById('lockSubInput');
    const robloxInput = document.getElementById('robloxInput');
    const facebookInput = document.getElementById('facebookInput');
    const tiktokInput = document.getElementById('tiktokInput');

    const mockVideo = document.getElementById('mockVideo');
    const mockImg = document.getElementById('mockImg');
    const prevName = document.getElementById('prevName');
    const prevStatus = document.getElementById('prevStatus');
    const prevLoc = document.getElementById('prevLoc');

    // Cập nhật Live Preview
    function updateLivePreview() {
      prevName.textContent = nameInput.value || 'kietsu';
      prevStatus.textContent = statusInput.value || '';
      prevLoc.textContent = locationInput.value || 'VIỆT NAM';

      if (appConfig.mediaType === 'video') {
        mockImg.style.display = 'none';
        mockVideo.style.display = 'block';
        mockVideo.src = appConfig.mediaUrl;
        mockVideo.play().catch(() => {});
      } else {
        mockVideo.style.display = 'none';
        mockImg.style.display = 'block';
        mockImg.src = appConfig.mediaUrl;
      }
    }

    // Lắng nghe thay đổi từ các ô nhập
    nameInput.addEventListener('input', updateLivePreview);
    statusInput.addEventListener('input', updateLivePreview);
    locationInput.addEventListener('input', updateLivePreview);

    // Chọn file từ máy tính
    mediaFileInput.addEventListener('change', (e) => {
      const file = e.target.files[0];
      if (!file) return;

      const isVideo = file.type.startsWith('video/');
      const reader = new FileReader();
      reader.onload = function(evt) {
        appConfig.mediaType = isVideo ? 'video' : 'image';
        appConfig.mediaUrl = evt.target.result;
        mediaUrlInput.value = '[File vừa chọn từ máy]';
        updateLivePreview();
      };
      reader.readAsDataURL(file);
    });

    mediaUrlInput.addEventListener('change', () => {
      const url = mediaUrlInput.value.trim();
      if (!url || url.startsWith('[')) return;
      appConfig.mediaType = (url.endsWith('.mp4') || url.endsWith('.webm')) ? 'video' : 'image';
      appConfig.mediaUrl = url;
      updateLivePreview();
    });

    // Xuất file index.html công khai (HOÀN TOÀN KHÔNG CÓ BẢNG SỬA, NGƯỜI NGOÀI KHÔNG THỂ SỬA)
    document.getElementById('btnExport').addEventListener('click', () => {
      const mediaTag = appConfig.mediaType === 'video'
        ? `<video class="bg-media" autoplay loop muted playsinline src="${appConfig.mediaUrl}"></video>`
        : `<img class="bg-media" referrerpolicy="no-referrer" src="${appConfig.mediaUrl}" alt="Background">`;

      const publicHtml = `<!DOCTYPE html>
<html lang="vi">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>${nameInput.value} • profile</title>
  <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
  <link href="https://fonts.googleapis.com/css2?family=Comfortaa:wght@700&family=JetBrains+Mono:wght@400;600&family=Quicksand:wght@500;700&display=swap" rel="stylesheet">
  <style>
    * { margin: 0; padding: 0; box-sizing: border-box; cursor: none !important; }
    body { font-family: 'Quicksand', sans-serif; background-color: #030305; color: #ffffff; min-height: 100vh; overflow: hidden; position: relative; }
    .bg-container { position: fixed; inset: 0; width: 100%; height: 100%; z-index: 0; overflow: hidden; pointer-events: none; }
    .bg-media { width: 100%; height: 100%; object-fit: cover; object-position: center; transform: scale(1.02); filter: brightness(0.9) contrast(1.15); }
    .bg-overlay { position: fixed; inset: 0; background: radial-gradient(circle at center, rgba(0,0,0,0.25) 0%, rgba(5,5,10,0.75) 100%); z-index: 1; pointer-events: none; }
    #starsCanvas { position: fixed; inset: 0; z-index: 2; pointer-events: none; }
    #cursorDot { position: fixed; top: 0; left: 0; width: 6px; height: 6px; background: #ffffff; border-radius: 50%; pointer-events: none; z-index: 99999; transform: translate(-50%, -50%); box-shadow: 0 0 10px #ffffff, 0 0 20px #ffffff; }
    #cursorRing { position: fixed; top: 0; left: 0; width: 32px; height: 32px; border: 1.5px solid rgba(255,255,255,0.8); border-radius: 50%; pointer-events: none; z-index: 99998; transform: translate(-50%, -50%); transition: width 0.2s, height 0.2s; }
    .sparkle { position: fixed; width: 4px; height: 4px; background: #ffffff; border-radius: 50%; pointer-events: none; z-index: 99997; transform: translate(-50%, -50%); animation: fadeSparkle 0.75s ease-out forwards; }
    @keyframes fadeSparkle { 0% { opacity: 1; transform: translate(-50%, -50%) scale(1); } 100% { opacity: 0; transform: translate(-50%, -16px) scale(0); } }
    .ripple-circle { position: absolute; border-radius: 50%; transform: translate(-50%, -50%) scale(0); pointer-events: none; border: 2px solid rgba(255,255,255,0.7); background: radial-gradient(circle, rgba(255,255,255,0.2) 0%, transparent 100%); animation: waterRipple 0.85s cubic-bezier(0.1, 0.8, 0.3, 1) forwards; z-index: 9999; }
    @keyframes waterRipple { 0% { width: 0; height: 0; opacity: 0.9; transform: translate(-50%, -50%) scale(0); } 100% { width: 320px; height: 320px; opacity: 0; transform: translate(-50%, -50%) scale(1); } }
    #lockScreen { position: fixed; inset: 0; z-index: 50; display: flex; flex-direction: column; align-items: center; justify-content: center; background: rgba(0,0,0,0.95); transition: opacity 0.6s ease; }
    .bio-glass { background: rgba(12,14,20,0.65); backdrop-filter: blur(16px); -webkit-backdrop-filter: blur(16px); border: 1px solid rgba(255,255,255,0.12); border-radius: 20px; box-shadow: 0 20px 40px -15px rgba(0,0,0,0.8); padding: 28px 24px; max-width: 420px; width: 100%; text-align: center; display: flex; flex-direction: column; align-items: center; gap: 16px; }
  </style>

<body>
  <div class="bg-container">${mediaTag}</div>
  <div class="bg-overlay"></div>
  <canvas id="starsCanvas"></canvas>
  <div id="cursorDot"></div>
  <div id="cursorRing"></div>

  <!-- MÀN HÌNH KHÓA -->
  <div id="lockScreen">
    <div style="display: flex; flex-direction: column; align-items: center; gap: 14px; text-align: center;">
      <div style="width: 80px; height: 80px; border-radius: 18px; overflow: hidden; border: 2px solid rgba(255,255,255,0.3); box-shadow: 0 0 25px rgba(255,255,255,0.2);">
        <img src="https://i.pinimg.com/564x/25/2b/4d/252b4d47e08f18c4efaafed82e11d20.jpg" alt="Lock" style="width: 100%; height: 100%; object-fit: cover;">
      </div>
      <h1 style="font-size: 26px; font-weight: 800;">${lockTitleInput.value}</h1>
      <p style="font-size: 13px; color: #94a3b8; font-family: 'JetBrains Mono', monospace;">${lockSubInput.value}</p>
      <span style="font-size: 10px; font-family: 'JetBrains Mono', monospace; opacity: 0.4; letter-spacing: 2px; margin-top: 8px;">[ CLICK ANYWHERE TO ENTER ]</span>
    </div>
  </div>

  <!-- PROFILE CHÍNH (NGƯỜI NGOÀI CHỈ XEM ĐƯỢC, HOÀN TOÀN KHÔNG CÓ NÚT SỬA) -->
  <main style="position: relative; z-index: 10; min-height: 100vh; display: flex; align-items: center; justify-content: center; padding: 24px;">
    <div class="bio-glass">
      <div style="width: 90px; height: 90px; border-radius: 50%; overflow: hidden; border: 2px solid rgba(255,255,255,0.4); box-shadow: 0 0 25px rgba(255,255,255,0.3);">

  <script>
    function createRipple(x, y) {
      const r = document.createElement('div'); r.className = 'ripple-circle'; r.style.left = x + 'px'; r.style.top = y + 'px'; document.body.appendChild(r);
      setTimeout(() => { if (r.parentNode) r.parentNode.removeChild(r); }, 900);
    }
    const lock = document.getElementById('lockScreen');
    lock.addEventListener('click', (e) => { createRipple(e.clientX, e.clientY); lock.style.opacity = '0'; setTimeout(() => { lock.style.display = 'none'; }, 600); });
    document.body.addEventListener('click', (e) => createRipple(e.clientX, e.clientY));
    const dot = document.getElementById('cursorDot'), ring = document.getElementById('cursorRing');
    let mx = window.innerWidth/2, my = window.innerHeight/2, rx = mx, ry = my;
    window.addEventListener('mousemove', (e) => { mx = e.clientX; my = e.clientY; dot.style.left = mx+'px'; dot.style.top = my+'px'; if(Math.random()<0.25) createSparkle(mx,my); });
    function renderC() { rx += (mx-rx)*0.18; ry += (my-ry)*0.18; ring.style.left = rx+'px'; ring.style.top = ry+'px'; requestAnimationFrame(renderC); } renderC();
    function createSparkle(x, y) { const s = document.createElement('div'); s.className = 'sparkle'; s.style.left = x+'px'; s.style.top = y+'px'; s.style.width = '3px'; s.style.height = '3px'; document.body.appendChild(s); setTimeout(() => { if (s.parentNode) s.parentNode.removeChild(s); }, 750); }
    const cvs = document.getElementById('starsCanvas'), ctx = cvs.getContext('2d');
    let stars = []; function rz() { cvs.width = window.innerWidth; cvs.height = window.innerHeight; } rz(); window.addEventListener('resize', rz);
    class St { constructor() { this.rst(); } rst() { this.x = Math.random()*cvs.width; this.y = Math.random()*cvs.height; this.s = Math.random()*1.5+0.3; this.vx = (Math.random()-0.5)*0.2; this.vy = Math.random()*0.4+0.1; this.o = Math.random()*0.7+0.2; } up() { this.x += this.vx; this.y += this.vy; if (this.y > cvs.height) { this.rst(); this.y = 0; } } dw() { ctx.fillStyle = 'rgba(255,255,255,'+this.o+')'; ctx.beginPath(); ctx.arc(this.x,this.y,this.s,0,Math.PI*2); ctx.fill(); } }
    for(let i=0; i<70; i++) stars.push(new St());
    function anim() { ctx.clearRect(0,0,cvs.width,cvs.height); stars.forEach(s => { s.up(); s.dw(); }); requestAnimationFrame(anim); } anim();
  <\/script>
